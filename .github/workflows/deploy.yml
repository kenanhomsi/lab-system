# اسم الـ workflow الذي سيظهر في واجهة GitHub Actions
name: Deploy to Hostinger VPS

# متى يتم تشغيل هذا الـ pipeline؟
on:
  push:
    branches: ["main"] # يتشغل عندما تدفع تغييرات إلى فرع main
  # يمكنك إضافة (workflow_dispatch) لتشغيله يدوياً من واجهة GitHub
  workflow_dispatch:

# المهام (jobs) التي ستنفذ – نحدد مهمة واحدة اسمها "deploy"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kenahomsi/lab-system-front:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_NEXTAUTH_URL=${{ secrets.NEXT_PUBLIC_NEXTAUTH_URL }}
            NEXT_PUBLIC_FRONTEND_URL=${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
            NEXT_PUBLIC_CKEDITOR_LICENSE_KEY=${{ secrets.NEXT_PUBLIC_CKEDITOR_LICENSE_KEY }}
            NEXT_PUBLIC_VERSION=${{ secrets.NEXT_PUBLIC_VERSION }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
            BACKEND_URL=${{ secrets.BACKEND_URL }}

      - name: Package Docker image for the VPS
        run: docker save "kenahomsi/lab-system-front:${{ github.sha }}" | gzip > lab-system-front.tar.gz

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 2m
          command_timeout: 15m
          source: "docker-compose.yml,lab-system-front.tar.gz"
          target: "/home/lab-system-front"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd /home/lab-system-front
            export APP_IMAGE_TAG='${{ github.sha }}'
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "ERROR: Neither 'docker compose' (v2) nor 'docker-compose' (v1) is installed on the VPS." >&2
              exit 1
            fi
            echo "Using compose command: $DC"
            gunzip -c lab-system-front.tar.gz | docker load
            $DC up -d --no-build --force-recreate --remove-orphans web
            rm -f lab-system-front.tar.gz
            docker image prune -f
